const $=x=>document.getElementById(x);function persist(){try{localStorage.setItem('nipa-recall-progress',JSON.stringify(saved))}catch(e){}};function stats(cat){const arr=DATA.filter(x=>x.cat===cat);return {total:arr.length,known:arr.filter(x=>saved[x.id]==='known').length,missed:arr.filter(x=>saved[x.id]==='missed').length}}
function home(){ $('home').classList.remove('hidden');$('study').classList.add('hidden');$('tiles').innerHTML=THEMES.map(([cat,desc],i)=>{let s=stats(cat);return `<button class="tile" data-cat="${cat}"><span class="emoji">${emoji[i]}</span><h2>${cat}</h2><p>${desc}</p><p style="margin-top:11px;color:#a5caee">${s.known}/50 알겠음 · ${s.missed}개 복습</p></button>`}).join('');document.querySelectorAll('[data-cat]').forEach(el=>el.onclick=()=>openCat(el.dataset.cat));let known=Object.values(saved).filter(x=>x==='known').length,unknown=Object.values(saved).filter(x=>x==='missed').length;$('homeStats').innerHTML=`<div class="stats"><div class="stat"><b>300</b><span class="small muted">전체 카드</span></div><div class="stat"><b>${known}</b><span class="small muted">알겠음</span></div><div class="stat"><b>${unknown}</b><span class="small muted">다시 복습</span></div></div>`}
function openCat(cat){currentCat=cat;mode='all';document.querySelectorAll('[data-mode]').forEach(el=>el.classList.toggle('active',el.dataset.mode==='all'));$('home').classList.add('hidden');$('study').classList.remove('hidden');$('sectionName').textContent=cat+' · 50장';makeDeck();}function makeDeck(){deck=DATA.filter(x=>x.cat===currentCat && (mode==='all'||mode==='unknown'&&saved[x.id]==='missed'||mode==='high'&&x.p==='상'));index=0;render()}function render(){let s=stats(currentCat);$('counts').textContent=`알겠음 ${s.known} · 복습 ${s.missed}`;$('studyStats').innerHTML=`<b>학습 현황</b><p class="muted small">현재 테마 ${s.total}장 · 알겠음 ${s.known}장 · 다시 볼 카드 ${s.missed}장</p><div class="progress"><div style="width:${100*s.known/s.total}%"></div></div>`;if(!deck.length){$('flash').classList.add('hidden');$('counter').textContent='표시할 카드가 없어!';$('progressFill').style.width='0%';$('prev').disabled=$('next').disabled=$('flip').disabled=$('miss').disabled=$('know').disabled=true;return;}$('flash').classList.remove('hidden');$('prev').disabled=$('next').disabled=$('flip').disabled=$('miss').disabled=$('know').disabled=false;index=Math.max(0,Math.min(index,deck.length-1));let x=deck[index];flipped=false;$('flash').classList.remove('ans');$('front').classList.remove('hidden');$('reverse').classList.add('hidden');$('counter').textContent=`${index+1} / ${deck.length}`;$('progressFill').style.width=`${(index+1)/deck.length*100}%`;$('cardTag').textContent=x.cat;$('question').textContent=x.q;$('answer').textContent=x.a;$('detail').textContent=x.e;$('source').innerHTML=x.source.startsWith('https://')?`출처: <a target="_blank" rel="noopener" href="${x.source}">공식자료 확인 ↗</a>`:'출처: '+x.source;let n={상:3,중:2,하:1}[x.p];$('priority').innerHTML=`중요도 ${x.p} <span class="bars">${[1,2,3].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</span>`;$('flip').textContent='정답 보기';$('flipHint').textContent='카드를 눌러 뒤집어봐';}function flip(){if(!deck.length)return;flipped=!flipped;$('front').classList.toggle('hidden',flipped);$('reverse').classList.toggle('hidden',!flipped);$('flash').classList.toggle('ans',flipped);$('flip').textContent=flipped?'질문 보기':'정답 보기';$('flipHint').textContent=flipped?'다시 누르면 질문으로':'카드를 눌러 뒤집어봐';}function advance(delta){index=(index+delta+deck.length)%deck.length;render()}function mark(v){if(!deck.length)return;let id=deck[index].id;saved[id]=v;persist();if(mode==='unknown'&&v==='known'){deck.splice(index,1);index=Math.min(index,deck.length-1);render()}else{index=(index+1)%deck.length;render()}}
$('goHome').onclick=home;$('flash').onclick=flip;$('flash').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};$('flip').onclick=flip;$('prev').onclick=()=>advance(-1);$('next').onclick=()=>advance(1);$('know').onclick=()=>mark('known');$('miss').onclick=()=>mark('missed');document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(el=>el.classList.toggle('active',el===b));makeDeck()});$('shuffle').onclick=()=>{for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}index=0;render()};$('reset').onclick=()=>{if(confirm('이 테마의 학습 기록을 초기화할까?')){DATA.filter(x=>x.cat===currentCat).forEach(x=>delete saved[x.id]);persist();makeDeck()}};document.addEventListener('keydown',e=>{if($('study').classList.contains('hidden')||['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')advance(1);if(e.key==='ArrowLeft')advance(-1)});home();
</script></body></html>
